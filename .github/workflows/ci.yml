name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.8'
      - run: uv sync --locked
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv build
      - run: uv run --locked python scripts/build_release.py
      - run: uv run --locked python scripts/smoke_release.py
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: gauge-release-candidate
          path: dist/*
          if-no-files-found: error
